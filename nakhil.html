<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complexe Nakhil | مطعم وكافيه النخيل</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        body { background-color: #090d16; color: #f3f4f6; direction: rtl; text-align: right; padding-top: 80px; }
        
        /* Header الجديد */
        header { 
            background: rgba(9, 13, 22, 0.95); 
            position: fixed; 
            top: 0; 
            width: 100%; 
            z-index: 1000; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.2); 
            backdrop-filter: blur(10px); 
        }

        /* الروابط على اليمين */
        .nav-links { display: flex; gap: 25px; }
        nav a { color: #f3f4f6; text-decoration: none; font-weight: 600; transition: 0.3s; font-size: 16px; }
        nav a:hover { color: #d4af37; }

        /* الاسم في الوسط */
        .center-logo { 
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 24px; 
            font-weight: 900; 
            color: #d4af37; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            pointer-events: none;
        }

        .left-icon { font-size: 20px; color: #d4af37; }

        /* Hero Section */
        .hero { 
            height: 80vh; 
            background: linear-gradient(rgba(9, 13, 22, 0.75), rgba(9, 13, 22, 0.85)), 
                        url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 0 20px; 
        }
        .hero h1 { font-size: 55px; color: #d4af37; margin-bottom: 20px; font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .hero p { font-size: 20px; color: #e5e7eb; margin-bottom: 35px; max-width: 650px; line-height: 1.6; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .btn { background: #d4af37; color: #090d16; padding: 15px 35px; border-radius: 50px; font-weight: 800; text-decoration: none; transition: 0.3s; border: none; cursor: pointer; display: inline-block; box-shadow: 0 4px 15px rgba(212,175,55,0.3); }
        .btn:hover { background: #f0c659; transform: translateY(-3px); }
        .btn-outline { background: transparent; color: #d4af37; border: 2px solid #d4af37; }
        .btn-outline:hover { background: #d4af37; color: #090d16; }

        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            .center-logo { font-size: 16px; }
            .nav-links { gap: 10px; }
            nav a { font-size: 13px; }
            .left-icon { display: none; }
            .hero h1 { font-size: 35px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="left-icon">🌴</div>
        <div class="center-logo">Complexe Nakhil</div>
        <div class="nav-links">
            <a href="nakhil.html">الرئيسية</a>
            <a href="menu.html">المنيو</a>
            <a href="avis.html">آراء الزبناء</a>
            <a href="reservation.html" style="color: #d4af37;">حجز طاولة</a>
        </div>
    </header>

    <section class="hero">
        <h1>تجربة ذوقية في أبهى حلة</h1>
        <p>نرحب بكم في مطعم وكافيه النخيل، حيث يلتقي التصميم الراقي بالأطباق الاستثنائية لخلق ذكريات لا تُنسى.</p>
        <div class="btn-group">
            <a href="menu.html" class="btn">استكشف المنيو الفاخر</a>
            <a href="reservation.html" class="btn btn-outline">احجز طاولة الآن</a>
        </div>
    </section>

</body>
</html>
