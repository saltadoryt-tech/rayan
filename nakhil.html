<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم وكافيه النخيل | Complex Nakhil</title>
    <style>
        /* التنسيقات الأساسية */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header, nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: #1e293b;
            border-bottom: 2px solid #d4af37;
            flex-wrap: wrap;
        }

        nav a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
        }

        nav a:hover {
            color: #f8fafc;
        }

        .hero-section {
            text-align: center;
            padding: 50px 20px;
        }

        h1 {
            color: #d4af37;
            font-size: 32px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 30px auto;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: #d4af37;
            color: #0f172a;
            padding: 12px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #d4af37;
            display: inline-block;
            box-sizing: border-box;
            text-align: center;
        }

        .btn-outline {
            background: transparent;
            color: #d4af37;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* تحسينات الهواتف المحمولة وتجنب تراكم الكلمات أو العناصر */
        @media screen and (max-width: 768px) {
            nav {
                flex-direction: column !important;
                align-items: center !important;
                gap: 10px !important;
                padding: 15px 0 !important;
            }

            nav a {
                font-size: 15px !important;
                margin: 3px 0 !important;
            }

            .hero-section {
                padding: 30px 15px !important;
            }

            h1 {
                font-size: 24px !important;
            }

            p {
                font-size: 15px !important;
            }

            .btn {
                width: 100% !important;
                max-width: 280px !important;
            }

            .container, header, main, footer {
                width: 100% !important;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <!-- القائمة الفوقية -->
    <header>
        <nav>
            <a href="nakhil.html">الرئيسية</a>
            <a href="menu.html">المنيو</a>
            <a href="reservation.html">حجز طاولة</a>
            <a href="avis.html">آراء الزبناء</a>
            <a href="loging.html">منطقة المدير</a>
        </nav>
    </header>

    <!-- الواجهة الرئيسية -->
    <main class="hero-section">
        <h1>تجربة ذوقية في أبقى حلة</h1>
        <p>نرحب بكم في مطعم وكافيه النخيل، حيث يلتقي التصميم الراقي بالأطباق الاستثنائية لخلق ذكريات لا تُنسى.</p>
        
        <div class="btn-container">
            <a href="menu.html" class="btn">استكشف المنيو الفاخر</a>
            <a href="reservation.html" class="btn btn-outline">احجز طاولة الآن</a>
        </div>
    </main>

</body>
</html>
