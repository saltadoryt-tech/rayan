<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطعم وكافيه النخيل | Complex Nakhil</title>
    <style>
        /* التنسيقات الأساسية مع صورة الخلفية */
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            /* إضافة صورة الخلفية للمطعم مع طبقة تعتيم لكي يظهر الكلام بوضوح */
            background-image: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.85)), url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        header, nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.95);
            border-bottom: 2px solid #d4af37;
            flex-wrap: wrap;
        }

        nav a {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #f8fafc;
        }

        .hero-section {
            text-align: center;
            padding: 70px 20px;
        }

        h1 {
            color: #d4af37;
            font-size: 32px;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto 35px auto;
            line-height: 1.6;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .btn {
            background: #d4af37;
            color: #0f172a;
            padding: 14px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #d4af37;
            display: inline-block;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-outline {
            background: rgba(15, 23, 42, 0.6);
            color: #d4af37;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }

        /* تحسينات الهواتف المحمولة وتجنب تراكم العناصر */
        @media screen and (max-width: 768px) {
            nav {
                flex-direction: column !important;
                align-items: center !important;
                gap: 10px !important;
                padding: 15px 0 !important;
            }

            nav a {
                font-size: 15px !important;
                margin: 3px 0 !important;
            }

            .hero-section {
                padding: 40px 15px !important;
            }

            h1 {
                font-size: 24px !important;
            }

            p {
                font-size: 15px !important;
            }

            .btn {
                width: 100% !important;
                max-width: 280px !important;
            }
        }
    </style>
</head>
<body>

    <!-- القائمة الفوقية -->
    <header>
        <nav>
            <a href="nakhil.html">الرئيسية</a>
            <a href="menu.html">المنيو</a>
            <a href="reservation.html">حجز طاولة</a>
            <a href="avis.html">آراء الزبناء</a>
            <a href="loging.html">منطقة المدير</a>
        </nav>
    </header>

    <!-- الواجهة الرئيسية مع الخلفية التصويرية الفاخرة -->
    <main class="hero-section">
        <h1>تجربة ذوقية في أبقى حلة</h1>
        <p>نرحب بكم في مطعم وكافيه النخيل، حيث يلتقي التصميم الراقي بالأطباق الاستثنائية لخلق ذكريات لا تُنسى.</p>
        
        <div class="btn-container">
            <a href="menu.html" class="btn">استكشف المنيو الفاخر</a>
            <a href="reservation.html" class="btn btn-outline">احجز طاولة الآن</a>
        </div>
    </main>

</body>
</html>
