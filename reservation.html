<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation | Complexe Nakhil</title>
    <style>
        :root {
            --bg-color: #2b2b2b;
            --card-bg: rgba(50, 50, 50, 0.85);
            --form-bg: rgba(40, 40, 40, 0.95);
            --beige: #c8a888;
            --cream: #f4dcc3;
            --soft-gray: #b8b3b6;
            --text-main: #ffffff;
            --text-muted: #d1d1d1;
            --border-color: rgba(200, 168, 136, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(200, 168, 136, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        header {
            background: rgba(35, 35, 35, 0.95);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            color: var(--cream);
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            letter-spacing: 0.5px;
        }

        .logo span {
            font-size: 9px;
            color: var(--soft-gray);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            align-items: center;
        }

        .nav-links a {
            color: var(--soft-gray);
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
            position: relative;
            padding-bottom: 3px;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--cream);
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--beige);
        }

        .btn-reserve-top {
            background: transparent;
            border: 1px solid var(--beige);
            color: var(--cream);
            padding: 8px 20px;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-decoration: none;
            transition: all 0.3s;
            border-radius: 2px;
        }

        .btn-reserve-top:hover {
            background: var(--beige);
            border-color: var(--beige);
            color: var(--bg-color);
        }

        .mobile-menu-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--cream);
            font-size: 20px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 992px) {
            .nav-container { padding: 15px 20px; }
            .mobile-menu-btn { display: flex; }
            .nav-links {
                position: absolute;
                top: 71px; left: 0; width: 100%;
                background: rgba(35, 35, 35, 0.98);
                flex-direction: column;
                align-items: center;
                padding: 25px 0; gap: 18px;
                border-bottom: 1px solid var(--border-color);
                transform: translateY(-150%); opacity: 0;
                transition: all 0.4s ease-in-out; pointer-events: none;
            }
            .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
            .btn-reserve-top { display: none; }
        }

        .reservation-section {
            max-width: 900px;
            margin: 40px auto 80px auto;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .res-hero {
            text-align: center;
            margin-bottom: 40px;
        }

        .res-hero span {
            color: var(--beige);
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        .res-hero h1 {
            font-size: 34px;
            font-family: serif;
            font-weight: 400;
            color: var(--cream);
            margin-bottom: 10px;
        }

        .res-hero p {
            color: var(--soft-gray);
            font-size: 13px;
            max-width: 550px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .res-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 40px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--cream);
            font-weight: 600;
        }

        input, select, textarea {
            background: var(--form-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 15px;
            font-size: 13px;
            border-radius: 2px;
            outline: none;
            transition: border-color 0.3s;
            width: 100%;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--beige);
        }

        input::placeholder, textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        select option {
            background: #2b2b2b;
            color: var(--text-main);
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        .btn-submit {
            background: var(--beige);
            color: var(--bg-color);
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.2s;
            border-radius: 2px;
            margin-top: 10px;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .res-card { padding: 20px; }
            .res-hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="nakhil.html" class="logo">
                Complexe Nakhil
                <span>RESTAURANT & COMPLEXE</span>
            </a>
            
            <div class="nav-links" id="navLinks">
                <a href="nakhil.html">Accueil</a>
                <a href="menu.html">Menu</a>
                <a href="reservation.html" class="active">Réservation</a>
                <a href="repartition.html">Service & Équipe</a>
                <a href="nakhil.html#contact">Contact</a>
                <a href="admin.html">Admin</a>
            </div>

            <a href="reservation.html" class="btn-reserve-top">Réserver</a>
            <button class="mobile-menu-btn" onclick="toggleMenu()">⋮</button>
        </div>
    </header>

    <section class="reservation-section reveal">
        <div class="res-hero">
            <span>Table & Espace</span>
            <h1>Réservez Votre Table</h1>
            <p>Vivez une expérience gastronomique unique au Complexe Nakhil. Réservez dès maintenant.</p>
        </div>

        <div class="res-card">
            <form id="reservationForm" onsubmit="handleReservation(event)">
                <div class="form-grid">
                    
                    <div class="form-group">
                        <label for="fullName">Nom Complet :</label>
                        <input type="text" id="fullName" placeholder="Ex: Mohamed Alami" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Numéro de Téléphone :</label>
                        <input type="tel" id="phone" placeholder="Ex: 06 00 00 00 00" required>
                    </div>

                    <div class="form-group">
                        <label for="date">Date :</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Heure :</label>
                        <input type="time" id="time" required>
                    </div>

                    <div class="form-group">
                        <label for="guests">Nombre de Personnes :</label>
                        <select id="guests" required>
                            <option value="" disabled selected>Sélectionnez...</option>
                            <option value="1">1 Personne</option>
                            <option value="2">2 Personnes</option>
                            <option value="4">4 Personnes</option>
                            <option value="6">6 Personnes ou plus</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="space">Espace Souhaité :</label>
                        <select id="space" required>
                            <option value="" disabled selected>Choisissez un espace...</option>
                            <option value="Salle Principale">Salle Principale</option>
                            <option value="Terrasse Ombragée">Terrasse Ombragée</option>
                            <option value="Espace Événementiel">Espace Événementiel</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="notes">Demandes Particulières (Optionnel) :</label>
                        <textarea id="notes" placeholder="Allergies, anniversaire, emplacement spécifique..."></textarea>
                    </div>

                </div>

                <button type="submit" class="btn-submit">Confirmer la Réservation</button>
            </form>
        </div>
    </section>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('open');
        }

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('open');
            });
        });

        async function handleReservation(e) {
            e.preventDefault();

            const formData = {
                name: document.getElementById('fullName').value,
                phone: document.getElementById('phone').value,
                date: document.getElementById('date').value,
                time: document.getElementById('time').value,
                persons: document.getElementById('guests').value,
                espace: document.getElementById('space').value,
                notes: document.getElementById('notes').value
            };

            try {
                const response = await fetch('/api/reservations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('Votre demande de réservation a bien été envoyée avec succès !');
                    document.getElementById('reservationForm').reset();
                } else {
                    alert('Une erreur est survenue, veuillez réessayer.');
                }
            } catch (err) {
                console.error("Erreur:", err);
                alert('Erreur de connexion au serveur.');
            }
        }

        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal');
            for (let i = 0; i < reveals.length; i++) {
                const windowHeight = window.innerHeight;
                const elementTop = reveals[i].getBoundingClientRect().top;
                if (elementTop < windowHeight - 80) {
                    reveals[i].classList.add('active');
                }
            }
        }

        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('load', revealOnScroll);
    </script>
</body>
</html>
