<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | الحجوزات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background-color: #090d16; color: #f3f4f6; direction: rtl; text-align: right; padding: 40px; min-height: 100vh; }
        .top-nav { position: absolute; top: 20px; right: 30px; display: flex; gap: 10px; }
        .nav-btn { background: #d4af37; color: #090d16; padding: 10px 20px; border-radius: 30px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .nav-btn:hover { background: #f0c659; }
        h1 { color: #d4af37; text-align: center; margin-bottom: 30px; font-size: 32px; }
        .table-container { max-width: 1100px; margin: 0 auto; background: #111827; border: 2px solid #d4af37; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px 20px; border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        th { background: #1f2937; color: #d4af37; }
        td { color: #e5e7eb; }
        .no-data { text-align: center; padding: 40px; color: #9ca3af; }
        .btn-accept { background-color: #10b981; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .btn-cancel { background-color: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-accept:hover { background-color: #059669; }
        .btn-cancel:hover { background-color: #dc2626; }
        .status-accepted { color: #10b981; font-weight: bold; }
        .status-cancelled { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>

    <!-- أزرار التنقل والحماية -->
    <div class="top-nav">
        <a href="analytics.html" class="nav-btn">📊 لوحة الأرباح والطلبات</a>
        <a href="nakhil.html" class="nav-btn">← عودة للرئيسية</a>
    </div>

    <h1>لوحة تحكم السيرفر (إدارة الحجوزات)</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>اسم الزبون</th>
                    <th>رقم الهاتف</th>
                    <th>عدد الأشخاص</th>
                    <th>وقت وتاريخ الحجز</th>
                    <th>الحالة / الإجراء</th>
                </tr>
            </thead>
            <tbody id="reservationsTable">
                <tr><td colspan="5" class="no-data">جاري جلب البيانات من السيرفر...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // التحقق من الحماية (إلا ما كانش مسجل دخول كمدير، يرجع لصفحة Login)
        if (localStorage.getItem('isManagerLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        async function fetchReservations() {
            try {
                const response = await fetch('http://localhost:3000/api/reservations');
                const reservations = await response.json();
                const tableBody = document.getElementById('reservationsTable');

                if (reservations.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="no-data">لا توجد أي حجوزات مسجلة حالياً.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = "";
                reservations.forEach((res, index) => {
                    let statusHtml = `
                        <button class="btn-accept" onclick="updateStatus(${index}, 'مقبول')">قبول</button>
                        <button class="btn-cancel" onclick="updateStatus(${index}, 'ملغي')">إلغاء</button>
                    `;

                    if (res.status === 'مقبول') {
                        statusHtml = `<span class="status-accepted">تم القبول ✓</span>`;
                    } else if (res.status === 'ملغي') {
                        statusHtml = `<span class="status-cancelled">تم الإلغاء ✕</span>`;
                    }

                    tableBody.innerHTML += `
                        <tr>
                            <td><b>${res.name}</b></td>
                            <td>${res.phone}</td>
                            <td>${res.persons}</td>
                            <td style="color: #d4af37;">${res.dateTime ? res.dateTime.replace('T', ' الوقت: ') : 'وقت غير محدد'}</td>
                            <td>${statusHtml}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                document.getElementById('reservationsTable').innerHTML = `<tr><td colspan="5" class="no-data" style="color: #ef4444;">تعذر الاتصال بالسيرفر!</td></tr>`;
            }
        }

        async function updateStatus(index, status) {
            try {
                await fetch(`http://localhost:3000/api/reservations/${index}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                fetchReservations(); 
            } catch (error) {
                alert('حدث خطأ أثناء تحديث الحالة');
            }
        }

        fetchReservations();
        setInterval(fetchReservations, 3000);
    </script>
</body>
</html>
