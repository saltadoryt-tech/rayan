<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration | Complexe Nakhil</title>
    <style>
        :root {
            --bg-dark: #121413;
            --bg-card: #1A1D1C;
            --wood-tone: #D4B28C;
            --text-light: #EAE5DE;
            --text-muted: #9C948B;
            --border-gold: rgba(197, 160, 89, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
        }

        /* --- LOGIN OVERLAY (مخفي في الأول حتى نتأكد) --- */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #121413;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .login-card h2 {
            font-size: 22px;
            font-family: serif;
            color: var(--wood-tone);
            margin-bottom: 10px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 25px;
        }

        .login-card input {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-gold);
            color: var(--text-light);
            padding: 12px 15px;
            font-size: 14px;
            margin-bottom: 20px;
            border-radius: 2px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
        }

        .login-card input:focus {
            border-color: var(--wood-tone);
        }

        .login-card button {
            background: var(--wood-tone);
            color: var(--bg-dark);
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
            transition: opacity 0.3s;
        }

        .login-card button:hover {
            opacity: 0.9;
        }

        .error-msg {
            color: #d98282;
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }

        /* --- ADMIN DASHBOARD --- */
        #adminDashboard {
            display: none; /* مخفي بشكل تام إفتراضياً */
        }

        header {
            background: rgba(18, 20, 19, 0.95);
            border-bottom: 1px solid var(--border-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(12px);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            color: var(--wood-tone);
            font-weight: 700;
            font-size: 18px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            letter-spacing: 1px;
        }

        .logo span {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--wood-tone);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #8c5a5a;
            color: #e88d8d;
            padding: 8px 18px;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #8c5a5a;
            color: #ffffff;
        }

        .admin-container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 40px;
        }

        .admin-hero h1 {
            font-size: 36px;
            font-family: serif;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .admin-card {
            background: var(--bg-card);
            border: 1px solid var(--border-gold);
            padding: 30px;
            margin-bottom: 30px;
        }

        .admin-card h3 {
            font-size: 18px;
            font-family: serif;
            color: var(--wood-tone);
            margin-bottom: 20px;
        }

        p { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <!-- نافذة طلب كلمة المرور (تظهر إجباري في البداية) -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Espace Administrateur</h2>
            <p>Entrez le mot de passe pour accéder au panneau.</p>
            <form onsubmit="verifyPassword(event)">
                <input type="password" id="adminPass" placeholder="••••••••" required autocomplete="off">
                <button type="submit">Valider</button>
                <div id="errorMsg" class="error-msg">Mot de passe incorrect.</div>
            </form>
        </div>
    </div>

    <!-- لوحة التحكم (محمية) -->
    <div id="adminDashboard">
        <header>
            <div class="nav-container">
                <a href="nakhil.html" class="logo">
                    Complexe Nakhil
                    <span>ADMIN DASHBOARD</span>
                </a>
                
                <div class="nav-links">
                    <a href="nakhil.html">Accueil</a>
                    <a href="admin.html" class="active">Admin</a>
                </div>

                <button class="btn-logout" onclick="logout()">Déconnexion</button>
            </div>
        </header>

        <div class="admin-container">
            <div class="admin-hero">
                <h1>Tableau de Bord</h1>
            </div>

            <div class="admin-card">
                <h3>Gestion des Réservations</h3>
                <p>Ici s'affichent les données protégées de l'administration du Complexe Nakhil.</p>
            </div>
        </div>
    </div>

    <script>
        // كلمة المرور الخاصة بالدخول (يمكنك تعديلها هنا)
        const CORRECT_PASSWORD = "nakhil2026";

        function verifyPassword(e) {
            e.preventDefault();
            const enteredVal = document.getElementById('adminPass').value;
            const errorElement = document.getElementById('errorMsg');

            if (enteredVal === CORRECT_PASSWORD) {
                // حفظ مؤشر الدخول بحيث يبقى مفتوحاً فقط خلال الجلسة الحالية للتبويب
                sessionStorage.setItem('nakhil_auth', 'authenticated');
                
                // إظهار لوحة التحكم وإخفاء شاشة الكود
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else {
                errorElement.style.display = 'block';
                document.getElementById('adminPass').value = '';
            }
        }

        function logout() {
            // مسح المصادقة وإعادة شحن الصفحة لإظهار نافذة الكود من جديد
            sessionStorage.removeItem('nakhil_auth');
            location.reload();
        }

        // التحقق الفوري عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const authStatus = sessionStorage.getItem('nakhil_auth');
            if (authStatus === 'authenticated') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'block';
            } else {
                // إخفاء الداشبورد والتأكد من ظهور نافذة الكود
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('adminDashboard').style.display = 'none';
            }
        });
    </script>
</body>
</html>
