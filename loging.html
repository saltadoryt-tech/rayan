<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول المدير | Nakhil</title>
    <style>
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: Tahoma, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            background: #1e293b; 
            border: 2px solid #d4af37; 
            padding: 40px; 
            border-radius: 15px; 
            width: 350px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { 
            color: #d4af37; 
            text-align: center; 
            margin-bottom: 25px; 
            font-size: 24px; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #d4af37; 
            font-weight: bold; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white;
            box-sizing: border-box;
        }
        input:focus { 
            outline: none; 
            border-color: #d4af37; 
        }
        button { 
            width: 100%; 
            background: #d4af37; 
            color: #0f172a; 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            font-weight: bold;
            font-size: 16px;
            cursor: pointer; 
        }
        button:hover { 
            background: #e6c547; 
        }
        .error-msg { 
            color: #ef4444; 
            text-align: center; 
            margin-top: 15px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

<div class="login-card">
    <h1>منطقة المدير (Manager)</h1>
    <form id="loginForm">
        <div class="form-group">
            <label for="password">كلمة المرور السرية:</label>
            <input type="password" id="password" required placeholder="أدخل كلمة السر هنا">
        </div>
        <button type="submit">دخول</button>
    </form>
    <p id="errorMsg" class="error-msg"></p>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const pass = document.getElementById('password').value;
        
        if (pass === 'nakhil2026') {
            localStorage.setItem('isManagerLoggedIn', 'true');
            window.location.href = 'admin.html';
        } else {
            document.getElementById('errorMsg').innerText = 'خطأ في كلمة المرور، أعد المحاولة';
        }
    });
</script>

</body>
</html>
